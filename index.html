<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badminton Tournament Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6fa;--surface:#fff;--surface-2:#f3f5fa;--card-border:#e4e8f1;--card-border-strong:#10b981;
--emerald:#10b981;--emerald-bright:#047857;--emerald-dim:#e7f8f1;--emerald-line:#a7e6cf;
--blue:#2563eb;--blue-bright:#1d4ed8;--blue-dim:#e8effe;--blue-line:#b6cbfa;
--purple:#7c3aed;--purple-bright:#6d28d9;--purple-dim:#f0eafe;
--cyan:#0891b2;--cyan-bright:#0e7490;--cyan-dim:#e0f5fa;
--ink:#0f172a;--mut:#475569;--faint:#8492a6;
--gold:#f59e0b;--gold-bright:#b45309;--gold-dim:#fef3dc;
--red:#dc2626;--red-dim:#fdecec;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 48px}
h1{font-size:1.15rem;margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:.75rem;margin:0 0 14px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:800}
svg{width:18px;height:18px;display:block}
button,input{font-family:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:6px}
.topbar{position:sticky;top:8px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;
 background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--card-border);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--emerald);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand-mark svg{width:21px;height:21px}
.subtitle{margin:0;font-size:.72rem;color:var(--faint)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status-badge{font-size:.66rem;font-weight:800;letter-spacing:.08em;padding:6px 11px;border-radius:99px;text-transform:uppercase}
.status-setup{background:var(--surface-2);color:var(--mut)}
.status-live{background:var(--emerald-dim);color:var(--emerald-bright)}
.status-champion{background:var(--gold-dim);color:var(--gold-bright)}
/* stepper */
.stepper{display:flex;align-items:center;margin-bottom:20px;overflow-x:auto;padding:2px 2px 6px}
.step-item{display:flex;align-items:center;flex:1;min-width:0}
.step{display:flex;align-items:center;gap:8px;flex:none;padding:5px 12px 5px 5px;border-radius:99px;background:var(--surface);border:1px solid var(--card-border)}
.step-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;background:var(--surface-2);color:var(--faint)}
.step-dot svg{width:13px;height:13px}
.step-label{font-size:.7rem;font-weight:700;color:var(--faint);white-space:nowrap}
.step.done .step-dot{background:var(--emerald);color:#fff}.step.done .step-label{color:var(--mut)}
.step.current{border-color:var(--emerald);box-shadow:0 0 0 3px var(--emerald-dim)}
.step.current .step-dot{background:var(--emerald);color:#fff}.step.current .step-label{color:var(--ink)}
.step.champion{border-color:var(--gold);background:var(--gold-dim)}
.step.champion .step-dot{background:var(--gold);color:#fff}.step.champion .step-label{color:var(--gold-bright)}
.step-skip{opacity:.4}
.step-line{flex:1;height:2px;background:var(--card-border);margin:0 6px;min-width:12px}.step-line.done{background:var(--emerald)}
/* cards */
.card{background:var(--surface);border:1px solid var(--card-border);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--surface);border:1px solid var(--card-border);border-top:3px solid var(--emerald);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat-icon{width:28px;height:28px;border-radius:8px;background:var(--emerald-dim);color:var(--emerald-bright);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.stat-icon svg{width:15px;height:15px}
.stat-blue{border-top-color:var(--blue)}.stat-blue .stat-icon{background:var(--blue-dim);color:var(--blue-bright)}
.stat-purple{border-top-color:var(--purple)}.stat-purple .stat-icon{background:var(--purple-dim);color:var(--purple-bright)}
.stat-cyan{border-top-color:var(--cyan)}.stat-cyan .stat-icon{background:var(--cyan-dim);color:var(--cyan-bright)}
.stat-gold{border-top-color:var(--gold)}.stat-gold .stat-icon{background:var(--gold-dim);color:var(--gold-bright)}
.stat-value{font-size:1.4rem;font-weight:800;line-height:1.1}
.stat-label{font-size:.66rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.stat-desc{font-size:.7rem;color:var(--faint);margin-top:3px}
/* match */
.match-card{text-align:center;border:1.5px solid var(--emerald-line);background:linear-gradient(180deg,#f2fcf8,#fff 60%)}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:6px}
.match-label{font-size:.72rem;font-weight:800;letter-spacing:.12em;color:var(--emerald-bright);display:flex;align-items:center;gap:6px}
.match-label svg{width:15px;height:15px}
.match-number{font-size:.7rem;font-weight:700;color:var(--faint);letter-spacing:.06em}
.scoreboard{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 20px;flex-wrap:wrap}
.player-name{font-size:clamp(1.3rem,5vw,2.1rem);font-weight:800;word-break:break-word}
.player-slot{max-width:40%;flex:1;min-width:120px}
.vs-sep{font-size:.75rem;font-weight:800;color:var(--faint);background:var(--surface-2);border-radius:99px;padding:6px 12px;flex:none}
.win-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.win-btn{padding:16px 10px;border:2px solid var(--emerald-line);border-radius:16px;background:var(--emerald-dim);color:var(--emerald-bright);display:flex;flex-direction:column;gap:2px;transition:.15s}
.win-btn-b{border-color:var(--blue-line);background:var(--blue-dim);color:var(--blue-bright)}
.win-label{font-weight:800;font-size:1.02rem;word-break:break-word}
.win-sub{font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.win-btn:hover{background:var(--emerald);border-color:var(--emerald);color:#fff;transform:translateY(-2px)}
.win-btn-b:hover{background:var(--blue);border-color:var(--blue)}
.win-btn:active{transform:scale(.98)}
.up-next{margin-top:14px;padding-top:12px;border-top:1px dashed var(--card-border);font-size:.8rem;color:var(--mut);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.up-next-label{font-weight:800;color:var(--faint);text-transform:uppercase;font-size:.64rem;letter-spacing:.08em;align-self:center}
.up-next i{color:var(--faint);font-style:normal}
/* buttons */
.btn{padding:9px 14px;border-radius:12px;border:1px solid var(--card-border);background:var(--surface);color:var(--ink);font-weight:700;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn svg{width:15px;height:15px}
.btn:hover{background:var(--surface-2);border-color:#cfd6e4}
.btn-primary{background:var(--emerald);border-color:var(--emerald);color:#fff}.btn-primary:hover{background:#0ea371;border-color:#0ea371}
.btn-destructive{background:var(--red-dim);color:var(--red);border-color:#f6c9c9}.btn-destructive:hover{background:#fbdcdc}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* tables */
.qual-banner{display:flex;align-items:center;gap:10px;background:var(--gold-dim);color:var(--gold-bright);border-radius:12px;padding:10px 14px;font-size:.82rem;font-weight:600;margin-bottom:14px}
.qual-banner svg{width:16px;height:16px;flex:none}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--card-border);white-space:nowrap}
th{color:var(--faint);font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
td.r,th.r{text-align:right}
tbody tr:nth-child(even),tr:nth-child(even) td{background:#fafbfd}
tr:hover td{background:var(--surface-2)}
.rank-cell{font-weight:800;color:var(--faint);width:28px}
.pill{padding:3px 10px;border-radius:99px;font-size:.68rem;font-weight:800;display:inline-flex;align-items:center;gap:5px}
.pill svg{width:12px;height:12px}
.pill-playing{background:var(--emerald-dim);color:var(--emerald-bright)}
.pill-qualified{background:var(--gold-dim);color:var(--gold-bright)}
.pill-eliminated{background:var(--red-dim);color:var(--red)}
.q-tag{font-size:.68rem;color:var(--faint);font-weight:600}
/* progress */
.progress-top{display:flex;align-items:baseline;gap:8px}
.progress-count{font-size:1.6rem;font-weight:800}
.progress-caption{font-size:.7rem;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--emerald);border-radius:99px;transition:width .5s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:99px;font-weight:700;font-size:.75rem;display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);color:var(--mut)}
.chip svg{width:12px;height:12px}
.chip-qualified{background:var(--gold-dim);color:var(--gold-bright)}
.chip-playing{background:var(--emerald-dim);color:var(--emerald-bright)}
.chip-eliminated{opacity:.7}
.hist-win{color:var(--emerald-bright);font-weight:800}
.hist-cancelled{opacity:.5;font-style:italic}
/* bracket */
.bracket-grid{display:flex;flex-direction:column;gap:10px}
.bracket-node{border:1px solid var(--card-border);border-radius:14px;padding:12px 14px;background:var(--surface-2)}
.bracket-title{font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.bracket-players{display:flex;align-items:center;gap:10px;font-weight:700;flex-wrap:wrap}
.bracket-vs{color:var(--faint);font-size:.66rem}
.bracket-players .winner{color:var(--emerald-bright)}
.bracket-result{margin-top:8px;font-size:.78rem;font-weight:700;color:var(--gold-bright);display:flex;align-items:center;gap:6px}
.bracket-result svg{width:14px;height:14px}
.bracket-pending{margin-top:8px;font-size:.75rem;color:var(--faint)}
.bracket-live{border-color:var(--emerald);background:var(--emerald-dim)}
.bracket-final{border-color:#f3d28a;background:var(--gold-dim)}
/* champion */
.champion-card{text-align:center;padding:44px 16px;overflow:hidden;border-color:#f3d28a;background:linear-gradient(180deg,var(--gold-dim),#fff)}
.champion-glow{display:none}
.champion-trophy{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 0 8px #fde9b8}
.champion-trophy svg{width:32px;height:32px}
.champion-tag{font-size:.76rem;font-weight:800;letter-spacing:.16em;color:var(--gold-bright);margin-bottom:6px}
.champion-name{font-size:clamp(2rem,8vw,3.2rem);font-weight:800}
.champion-sub{color:var(--mut);font-size:.88rem;margin-top:6px}
/* setup */
.setup-hint{color:var(--mut);font-size:.84rem;margin:0 0 14px}
.np-field{display:flex;flex-direction:column;gap:6px;max-width:180px}
.np-field label{font-size:.75rem;font-weight:700;color:var(--mut)}
input{font:inherit;padding:10px 12px;border:1px solid var(--card-border);border-radius:12px;background:#fff;color:var(--ink);width:100%}
input:focus{border-color:var(--emerald);box-shadow:0 0 0 3px var(--emerald-dim);outline:0}
.frow{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:14px 0}
.player-field{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--card-border);border-radius:14px;padding:6px 10px}
.player-badge{width:26px;height:26px;border-radius:50%;background:var(--emerald);color:#fff;font-weight:800;font-size:.72rem;display:flex;align-items:center;justify-content:center;flex:none}
.player-field input{border:0;background:transparent;padding:4px 0;box-shadow:none}
.setup-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--red);font-weight:600;min-height:1.3em;font-size:.85rem;display:flex;align-items:center;gap:6px;margin:6px 0 12px}
.err svg{width:14px;height:14px;flex:none}.err:empty{margin:0}
ul.rules{margin:0;padding-left:18px;color:var(--mut);font-size:.85rem}
ul.rules li{margin:7px 0}ul.rules b{color:var(--ink)}
/* modal + toast */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal-card{max-width:400px;margin:0}
.modal-icon{width:40px;height:40px;border-radius:12px;background:var(--red-dim);color:var(--red);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.modal-icon svg{width:20px;height:20px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:.82rem;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:10}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){.topbar{flex-direction:column;align-items:flex-start}.win-btns{grid-template-columns:1fr}.player-slot{max-width:100%}.vs-sep{order:2}}
@media print{.topbar-right,.win-btns,.stepper,#toast{display:none!important}body{background:#fff}.card{box-shadow:none}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation:none!important}}

:root{--lime:#65a30d;--lime-dim:#f0f9dc;--lime-line:#c8e88c}
.status-live{background:var(--lime-dim);color:#4d7c0f}
.pill-playing,.chip-playing{background:var(--lime-dim);color:#4d7c0f}
.pill-qualified,.chip-qualified{background:var(--emerald-dim);color:var(--emerald-bright)}
.bar i{background:linear-gradient(90deg,var(--lime),var(--emerald))}
.step.current{border-color:var(--lime);box-shadow:0 0 0 3px var(--lime-dim)}.step.current .step-dot{background:var(--lime)}
.player-name-a{color:var(--emerald-bright)}.player-name-b{color:var(--blue-bright)}
.win-btn{background:var(--emerald-dim)}.win-btn:hover{box-shadow:0 10px 22px -10px rgba(16,185,129,.6)}.win-btn-b:hover{box-shadow:0 10px 22px -10px rgba(37,99,235,.55)}
.match-card,.bracket-live,.champion-card{animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stat-card{transition:transform .2s,box-shadow .2s}.stat-card:hover{transform:translateY(-3px)}
.dots{display:inline-flex;gap:3px;margin-right:4px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--card-border);transition:background .3s}.dots i.on{background:var(--lime)}
.ko-alert{display:flex;align-items:center;gap:10px;border-radius:14px;padding:11px 14px;margin-bottom:16px;font-size:.88rem;font-weight:600;animation:rise .3s ease}
.ko-alert.semi{background:var(--gold-dim);color:var(--gold-bright);border:1px solid #f3d28a}
.ko-alert.final{background:var(--red-dim);color:var(--red);border:1px solid #f6c9c9}
.ko-alert svg{width:18px;height:18px;flex:none}
.kbd-hint{margin-top:14px;font-size:.72rem;color:var(--faint)}
kbd{font:inherit;font-weight:700;font-size:.7rem;background:var(--surface-2);border:1px solid var(--card-border);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--mut)}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:20;width:min(92vw,380px);pointer-events:none}
.t{background:#fff;border:1px solid var(--card-border);border-left:5px solid var(--blue);border-radius:12px;padding:10px 14px;font-size:.84rem;font-weight:600;box-shadow:0 10px 30px -10px rgba(15,23,42,.3);animation:slide .3s ease;transition:.3s}
.t.out{opacity:0;transform:translateY(-10px)}
.t-green{border-left-color:var(--emerald);background:var(--emerald-dim)}.t-red{border-left-color:var(--red);background:var(--red-dim)}
.t-yellow{border-left-color:var(--gold);background:var(--gold-dim)}.t-blue{border-left-color:var(--blue)}
@keyframes slide{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.big-title{text-transform:none!important;letter-spacing:0!important;font-size:1.3rem!important;color:var(--ink)!important;margin:0 0 6px!important}
.big-msg{margin:0 0 16px;color:var(--mut);font-size:.9rem}.big-btn{width:100%;justify-content:center}
.big-yellow{border-color:#f3d28a}.big-red{border-color:#f6c9c9}.big-gold{border-color:#f3d28a}
.bi-yellow,.bi-gold{background:var(--gold-dim);color:var(--gold-bright)}
.modal-overlay.big{animation:fade .2s ease}@keyframes fade{from{opacity:0}}
.cf{position:fixed;top:-14px;width:8px;height:14px;border-radius:2px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
html{scroll-behavior:smooth}

.scoreboard .player-slot:first-child{animation:fromL .45s cubic-bezier(.2,.8,.2,1)}
.scoreboard .player-slot:last-child{animation:fromR .45s cubic-bezier(.2,.8,.2,1)}
.vs-sep{animation:pop .5s .25s both}
@keyframes fromL{from{opacity:0;transform:translateX(-40px)}}
@keyframes fromR{from{opacity:0;transform:translateX(40px)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes flashL{from{background:#d9f2a6}to{background:transparent}}
@keyframes flashG{from{background:#a7e6cf}to{background:transparent}}
@keyframes flashR{from{background:#f9c4c4}to{background:transparent}}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-12deg)}100%{opacity:1;transform:none}}
tr.row-w td{animation:flashL 1.6s}tr.row-e td{animation:flashR 1.8s}tr.row-q td{animation:flashG 1.8s}
tr.row-q .pill,tr.row-e .pill{animation:stamp .5s cubic-bezier(.2,1.4,.4,1)}
.bar i{position:relative;overflow:hidden}
.bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.4s infinite}
@keyframes shine{to{transform:translateX(100%)}}
.champion-name{background:linear-gradient(90deg,#b45309,#f59e0b,#fde68a,#f59e0b,#b45309);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gold 3s linear infinite}
@keyframes gold{to{background-position:-250% 0}}
.champion-trophy{animation:trophy .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes trophy{0%{transform:scale(0) rotate(-20deg)}100%{transform:none}}

/* ===== v4: layout, responsive, effects ===== */
body{background:radial-gradient(900px 520px at 6% -8%,#e1f6ea,transparent 60%),radial-gradient(800px 520px at 100% 0,#e4ecfd,transparent 55%),radial-gradient(#cfd6e6 1px,transparent 1.3px) 0 0/22px 22px,var(--bg)}
*{scrollbar-width:thin;scrollbar-color:#b9c4d6 transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#b9c4d6;border-radius:99px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:#10b981;background-clip:content-box}
::selection{background:#a7e6cf;color:#064e3b}
.wrap{max-width:1200px}
.topbar{position:static}
.lbl{white-space:nowrap}
.btn,.win-btn,.tab{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(3.2);opacity:0}}
.brand-mark.wiggle{animation:wig .6s ease}

var UKEY='bt_undo_v1',UStack=[];

/* ---------- Fixture engine: round-based scheduler ----------
   Every round pairs up ALL currently-active players at once (one bye if the
   count is odd), so no player can ever be scheduled twice in the same round.
   Pairing within a round minimizes repeat match-ups first, then games played,
   which keeps things fair as players qualify out mid-round. */
function active(){var r=[];S.players.forEach(function(p,i){if(p.status==='playing')r.push(i)});return r}
function repCount(i,j){return S.history.filter(function(h){return (h.a===i&&h.b===j)||(h.a===j&&h.b===i)}).length}
function cmp(a,b){for(var i=0;i<a.length;i++){if(a[i]!==b[i])return a[i]-b[i]}return 0}
function valid(m){return m&&S.players[m.a].status==='playing'&&S.players[m.b].status==='playing'}
function buildRound(){
  var pool=active().slice(),sit=null;
  if(pool.length%2===1){
    sit=pool.slice().sort(function(a,b){
      return (S.players[a].byes||0)-(S.players[b].byes||0)||S.players[a].played-S.players[b].played||a-b;
    })[0];
    S.players[sit].byes=(S.players[sit].byes||0)+1;
    pool=pool.filter(function(i){return i!==sit});
  }
  pool.sort(function(a,b){return S.players[a].played-S.players[b].played||a-b});
  var last=S.history[S.history.length-1],best=null,bestC=1e9;
  function cost(p,q){var r=repCount(p,q);return r*r*10+(last&&((last.a===p&&last.b===q)||(last.a===q&&last.b===p))?3:0)}
  (function dfs(rem,cur,c){ // try every way to split the pool into pairs; keep the one with the fewest repeats
    if(c>=bestC)return;
    if(!rem.length){best=cur;bestC=c;return}
    var p=rem[0],rest=rem.slice(1);
    rest.map(function(q,i){return{q:q,i:i,k:[cost(p,q),S.players[q].played,q]}}).sort(function(x,y){return cmp(x.k,y.k)}).forEach(function(o){
      dfs(rest.filter(function(_,i){return i!==o.i}),cur.concat([{a:p,b:o.q}]),c+o.k[0]);
    });
  })(pool,[],0);
  var matches=best;
  return {matches:matches,sitOut:sit,pos:0};
}
function ensureRound(){
  while(true){
    if(S.round){
      while(S.round.pos<S.round.matches.length&&!valid(S.round.matches[S.round.pos])){
        var mm=S.round.matches[S.round.pos];
        S.cancelled.push({a:mm.a,b:mm.b,reason:'Player Qualified'});
        S.round.pos++;
      }
      if(S.round.pos<S.round.matches.length)return;
    }
    if(active().length>=2){S.round=buildRound();S.roundNo=(S.roundNo||0)+1}
    else{S.round=null;return}
  }
}
function plan(){
  ensureRound();
  S.current=S.round?S.round.matches[S.round.pos]:null;
  S.onDeck=null;
  if(S.round){
    var i=S.round.pos+1;
    while(i<S.round.matches.length&&!valid(S.round.matches[i]))i++;
    if(i<S.round.matches.length)S.onDeck=S.round.matches[i];
  }

    qOrder:[],history:[],cancelled:[],current:null,onDeck:null,ko:null,champion:null,round:null,roundNo:0};

function record(w,no){
  if(S.stage!=='qual'||!S.current||no!==S.history.length+1)return; // guards duplicate submission
  pushUndo();
  var m=S.current,l=w===m.a?m.b:m.a;
  S.history.push({no:no,a:m.a,b:m.b,w:w});
  S.players[m.a].played++;S.players[m.b].played++;S.players[w].wins++;
  if(S.round)S.round.pos++;
  if(S.players[w].wins>=2){S.players[w].status='qualified';S.qOrder.push(w);S.players[w].q=S.qOrder.length}
  if(S.qOrder.length>=S.target){
    while(S.round&&S.round.pos<S.round.matches.length){
      var mm=S.round.matches[S.round.pos];
      S.cancelled.push({a:mm.a,b:mm.b,reason:valid(mm)?'Qualification Complete':'Player Qualified'});
      S.round.pos++;
    }
    S.players.forEach(function(p){if(p.status==='playing')p.status='eliminated'});

}
function seriesBody(s,live){
  var h='<div class="scoreboard"><div class="player-slot"><span class="player-name player-name-a">'+nm(s.a)+'</span></div><span class="vs-sep">VS</span><i class="shuttle">'+ICON.shuttle+'</i><div class="player-slot"><span class="player-name player-name-b">'+nm(s.b)+'</span></div></div>';
  h+='<div style="margin-bottom:14px">'+(s.w!==null?'<span class="pill pill-qualified">'+ICON.trophy+' Winner: '+nm(s.w)+'</span>':'<span class="pill pill-playing">● Awaiting result</span>')+'</div>';
  if(live&&s.w===null){var n=s.g.length+1;h+='<div class="win-btns"><button class="win-btn" onclick="pick('+s.a+')"><span class="win-label">'+nm(s.a)+'</span><span class="win-sub">Declare winner</span></button>'+
    '<button class="win-btn win-btn-b" onclick="pick('+s.b+')"><span class="win-label">'+nm(s.b)+'</span><span class="win-sub">Declare winner</span></button></div>'}
  return h+(live&&s.w===null?'<div class="kbd-hint"><kbd>A</kbd> / <kbd>B</kbd> declare winner &nbsp;·&nbsp; <kbd>Z</kbd> undo &nbsp;·&nbsp; <kbd>?</kbd> help</div>':'');
}
function champView(){
  return '<div class="card champion-card"><div class="champion-glow"></div><div class="champion-trophy">'+ICON.trophy+'</div>'+
   '<div class="champion-tag">TOURNAMENT CHAMPION</div><div class="champion-name">'+nm(S.champion)+'</div>'+
   '<p class="champion-sub">Congratulations on a well-earned victory!</p></div>'+
   '<div class="card"><h2>Knockout Results</h2><div class="bracket-grid">'+S.ko.sf.map(function(x){return bracketLine(x)}).join('')+bracketLine(S.ko.final)+'</div></div>';
}
function standings(){
  var idx=S.players.map(function(_,i){return i});
  idx.sort(function(a,b){
    var pa=S.players[a],pb=S.players[b],r={qualified:0,playing:1,eliminated:2};
    if(r[pa.status]!==r[pb.status])return r[pa.status]-r[pb.status];
    if(pa.status==='qualified')return pa.q-pb.q;
    return pb.wins-pa.wins||pa.played-pb.played||a-b;
  });
  var h='<div class="card">'+(S.stage!=='qual'?'<div class="qual-banner">'+ICON.trophy+' <b>'+S.target+' players qualified'+(S.target===4?' for the semi-finals':' for the final')+'.</b> '+(S.players.length-S.target)+' eliminated.</div>':'')+
   '<h2>Live Standings</h2><div class="scroll"><table class="st"><tr><th>Rank</th><th>Player</th><th class="r">Wins</th><th class="r">Played</th><th class="r">Win %</th><th>Status</th></tr>';
  idx.forEach(function(i,r){var p=S.players[i];h+='<tr data-i="'+i+'" class="st-'+p.status+'"><td class="rank-cell">'+(r+1)+'</td><td><b>'+nm(i)+'</b>'+(p.q?' <span class="seed q'+p.q+'">Q'+p.q+'</span>':'')+'</td><td class="r">'+(S.stage==='qual'?'<span class="dots">'+dots(p)+'</span> ':'')+tw(i).w+'</td><td class="r"><b>'+tw(i).pl+'</b></td><td class="r">'+winPct(i)+'</td><td>'+pill(p)+'</td></tr>'});
  return h+'</table></div></div>';
}
function progress(){
  var q=S.qOrder.length,pc=Math.round(q/S.target*100);
  var h='<div class="card"><h2>Qualification Progress</h2><div class="progress-top"><span class="progress-count">'+q+' / '+S.target+'</span><span class="progress-caption">Qualified</span></div>'+
   '<div class="bar"><i style="width:'+pc+'%"></i></div><div class="chips">';
  S.qOrder.forEach(function(i){h+='<span class="chip chip-qualified">'+ICON.check+nm(i)+'</span>'});
  S.players.forEach(function(p,i){if(p.status==='playing')h+='<span class="chip chip-playing">● '+nm(i)+'</span>';if(p.status==='eliminated')h+='<span class="chip chip-eliminated">'+ICON.alert+nm(i)+'</span>'});
  return h+'</div></div>';
}
function history(){
  var h='<div class="card"><h2>Match History</h2><div class="scroll"><table><tr><th>Match</th><th>Players</th><th>Result</th></tr>';
  if(!S.history.length&&!S.cancelled.length)h+='<tr><td colspan="3" style="color:var(--faint)">No matches played yet.</td></tr>';
  S.history.forEach(function(m){h+='<tr><td>'+m.no+'</td><td>'+nm(m.a)+' vs '+nm(m.b)+'</td><td><span class="hist-win">'+nm(m.w)+'</span> won</td></tr>'});
  koDone().forEach(function(s,k){h+='<tr class="hist-ko"><td>'+(S.history.length+k+1)+'</td><td><span class="stg">'+esc(s.label)+'</span> '+nm(s.a)+' vs '+nm(s.b)+'</td><td><span class="hist-win">'+nm(s.w)+'</span> won</td></tr>'});
  S.cancelled.forEach(function(m){h+='<tr class="hist-cancelled"><td>—</td><td>'+nm(m.a)+' vs '+nm(m.b)+'</td><td>Cancelled — '+m.reason+'</td></tr>'});
  return h+'</table></div></div>';
}

/* ---------- Setup ---------- */
function renderSetup(){
  var h='<header class="topbar"><div class="brand"><span class="brand-mark">'+ICON.racket+'</span><div><h1>BADMINTON TOURNAMENT</h1>'+
   '<p class="subtitle">Tournament Management Dashboard</p></div></div></header>'+stepper()+
  '<div class="card"><h2 class="setup-title">Tournament Setup</h2><p class="setup-hint">Set the number of competitors and enter their names to begin.</p>'+
  '<div class="np-field"><label for="np">Number of players <span style="color:var(--faint)">(3–16)</span></label>'+
  '<input class="np-input" id="np" type="number" min="3" max="16" value="'+dn+'" oninput="setN(this.value)"></div>'+
  '<div class="frow" id="fields"></div>'+
  '<div class="err" id="err"></div><div class="setup-actions"><button class="btn btn-primary" onclick="tryStart()">'+ICON.racket+' Start Tournament</button><button class="btn btn-secondary" onclick="shuffleDraft()">'+ICON.shuffle+' Shuffle players</button></div></div>'+
  '<div class="card"><h2>Rules</h2><ul class="rules"><li>A player needs <b>2 match wins</b> to qualify; each match gives exactly 1 win.</li>'+
  '<li>Qualified players stop playing; their future matches are cancelled. Results are never changed.</li>'+
  '<li>Qualification ends when <b>4 players</b> have qualified; everyone else is eliminated (with 3–4 players, the top 2 go straight to the final).</li>'+
  '<li>Matches are scheduled in rounds: every active player is paired up once per round (one sits a bye on odd counts), so nobody plays twice before everyone has played once. Repeat pairings are avoided where possible.</li>'+
  '<li>Made a mistake declaring a winner? Use <b>Undo Last Result</b> in the header to instantly revert it.</li>'+
  '<li>Semi-finals: Q1 vs Q4 and Q2 vs Q3. Semi-finals and the final are each a single match.</li></ul></div>';
  document.getElementById('app').innerHTML=h;fields();
}
function defName(i){return i<26?String.fromCharCode(65+i):'P'+(i+1)}
function setN(v){var n=parseInt(v,10);if(isNaN(n))return;dn=n;if(n>=3&&n<=16)fields();else document.getElementById('fields').innerHTML=''}
function fields(){
  for(var i=0;i<dn;i++)if(draft[i]===undefined)draft[i]=defName(i);
  document.getElementById('fields').innerHTML=Array.from({length:dn},function(_,i){
    return '<div class="player-field"><span class="player-badge">'+(i+1)+'</span><input value="'+esc(draft[i])+'" oninput="draft['+i+']=this.value" maxlength="24" placeholder="Player '+(i+1)+' name"></div>'}).join('');
}
function tryStart(){
  var e=document.getElementById('err');
  if(!(dn>=3&&dn<=16)){e.innerHTML=ICON.alert+'Number of players must be between 3 and 16.';return}
  var names=draft.slice(0,dn).map(function(x){return (x||'').trim()}),seen={};
  for(var i=0;i<dn;i++){
    if(!names[i]){e.innerHTML=ICON.alert+'Player '+(i+1)+' needs a name.';return}
    var k=names[i].toLowerCase();if(seen[k]){e.innerHTML=ICON.alert+'Duplicate name: "'+names[i]+'". Names must be unique.';return}seen[k]=1;
  }
  e.innerHTML='';
  startTournament(names,dn);
}
load();render();
</script></body></html>
